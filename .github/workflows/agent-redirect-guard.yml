name: Agent · Redirect guard

# This is the highest-stakes check in the repository.
#
# The store used to be the apex. Somewhere there is a customer holding an email
# with a signed link to bbanetwork.org/api/download?token=…, who has not clicked
# it yet. If a refactor, a routing change or a detached custom domain breaks
# that path, they paid for a file they cannot get — and the failure is silent.
# Nobody opens a support ticket to say "my download worked".
#
# The unit tests cover the redirect logic. This covers the deployed reality:
# DNS, the custom domain binding, and the Worker that is actually serving.
on:
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch:

concurrency:
  group: agent-redirect-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Check the paths a paying customer depends on
        id: probe
        run: |
          BASE="${SITE_URL:-$FALLBACK_URL}"
          STORE="https://guides.bbanetwork.org"
          FAILURES=""

          # Check we are probing this hub before asserting anything about it.
          #
          # This used to exit 0 — while the apex still belonged to Project 2's
          # store, reporting the store's answers as this repo's failures would
          # have opened an urgent issue every morning about nothing.
          #
          # The apex is attached to this hub now, so that same condition means
          # the opposite: the custom domain has been detached or reassigned,
          # and every receipt link pointing here is dead. It is the single
          # worst thing that can happen to this repository, so it is the
          # failure reported first and by name.
          # grep with a whitespace class, not a glob: /api/health is
          # pretty-printed, so the body reads `"service": "..."` with a space.
          HEALTH=$(curl -sf --max-time 20 "$BASE/api/health" || echo '')
          if ! echo "$HEALTH" | grep -q '"service"[[:space:]]*:[[:space:]]*"bba-network-hub"'; then
            if [ -z "$HEALTH" ]; then
              WHY="$BASE did not answer at all. The hostname resolves to nothing, or the Worker behind it is gone."
            else
              WHY="$BASE answered with something other than this hub, so the hostname is attached to a different Worker."
            fi
            {
              echo "failed=true"
              echo "detail<<EOF"
              echo "  $WHY"
              echo "  Every legacy /api/download link in an already-sent receipt is dead while this is true."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::error title=The apex is not serving this hub::$WHY See docs/DOMAINS.md, 'Attaching a domain to a Worker'."
            exit 0
          fi

          # path | expected status | expected redirect prefix
          check() {
            local path="$1" want_code="$2" want_prefix="$3"
            local code loc
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$path" || echo 000)
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 "$BASE$path" || echo '')
            printf '  %-42s %s → %s\n' "$path" "$code" "${loc:-<none>}"

            if [ "$code" != "$want_code" ]; then
              FAILURES="$FAILURES\n  $path expected $want_code, got $code"
              return
            fi
            case "$loc" in
              "$want_prefix"*) ;;
              *) FAILURES="$FAILURES\n  $path redirected to '$loc', expected to start with '$want_prefix'" ;;
            esac
          }

          echo "Checking legacy apex paths against $BASE"

          # 308, not 301: a 301 lets a client turn a POST into a GET, which
          # would silently neuter the checkout and webhook endpoints.
          check "/api/download?token=guard" 308 "$STORE/api/download"
          check "/api/checkout"             308 "$STORE/api/checkout"
          check "/products/espresso-dial-in-card" 301 "$STORE/products/espresso-dial-in-card"
          check "/success"                  301 "$STORE/success"

          # Does the place all of that points to actually exist?
          #
          # Every check above passes on a `308` carrying the right Location
          # header. None of them asks whether anything answers at the other
          # end, so this guard would report a perfect score while every
          # customer landed on a dead host.
          #
          # No such outage has happened. This check was added on a false alarm
          # — a `guides` row missing from the DNS records table was read as the
          # host being gone, when a probe showed it answering fine. The alarm
          # was wrong; the gap it exposed was not. A guard whose entire purpose
          # is the path a paying customer walks has to walk the whole path.
          #
          # Deliberately not `-f`: the store may legitimately answer 401/403/404
          # for a made-up token or an unknown path. What is being tested here
          # is that the HOST is reachable and serving, not what it says.
          set +e
          curl -sS -o /dev/null --max-time 20 "$STORE/" 2>/tmp/store-error
          STORE_RC=$?
          set -e
          if [ "$STORE_RC" -ne 0 ]; then
            STORE_WHY=$(tr -d '\r' < /tmp/store-error | tail -1)
            printf '  %-42s unreachable (%s)\n' "$STORE" "curl exit $STORE_RC"
            FAILURES="$FAILURES\n  $STORE does not answer — ${STORE_WHY:-curl exit $STORE_RC}. Every redirect above lands here, so all of them are dead ends however correct their status codes look."
          else
            printf '  %-42s reachable\n' "$STORE"
          fi

          # The hub must keep its own endpoints rather than forwarding them to
          # a store that has never heard of them. /licence is here rather than
          # in the redirect list above because the hub now serves the network's
          # licence itself.
          for own in /api/health /api/stats /licence; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$own" || echo 000)
            printf '  %-42s %s\n' "$own" "$code"
            [ "$code" = "200" ] || FAILURES="$FAILURES\n  $own expected 200, got $code"
          done

          if [ -n "$FAILURES" ]; then
            {
              echo "failed=true"
              echo "detail<<EOF"
              printf '%b\n' "$FAILURES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            printf '::error::Legacy redirects are broken:%b\n' "$FAILURES"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FALLBACK_URL: https://bbanetwork.org

      # Can this run actually investigate?
      #
      # The step below needs a Claude credential. With neither secret set the
      # action starts and fails, which turns a probe that worked into a red X
      # and buries the finding it was reporting — a missing optional credential
      # should never look like a broken check. `secrets` is not available in a
      # step-level `if`, so the answer is computed here and read as an output.
      - name: Is an investigator configured?
        id: investigator
        if: always()
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Investigate and report
        if: steps.probe.outputs.failed == 'true' && steps.investigator.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Use the `redirect-guard` subagent.

            These checks failed against the live apex:
            ${{ steps.probe.outputs.detail }}

            Treat this as urgent: a broken /api/download means paying customers
            cannot retrieve files they have already been charged for.

            Open an issue labelled `ops` and `urgent` unless an OPEN one about the
            same path already exists, in which case comment on it.
          claude_args: |
            --allowed-tools Read,Bash,Grep,Glob,WebFetch
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FALLBACK_URL: https://bbanetwork.org

      # The finding still has to surface when there is nobody to hand it to.
      - name: Say it anyway if nothing could investigate
        if: steps.probe.outputs.failed == 'true' && steps.investigator.outputs.ready != 'true'
        run: |
          echo "::warning title=A legacy customer path is broken::${{ steps.probe.outputs.detail }}  No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY is set, so no agent looked into it and no issue was opened."

      # Report into Project 4's console.
      #
      # This never fails the job — losing a log entry must not fail work that
      # already succeeded. But it no longer fails *silently*. A bare `|| true`
      # made an unset URL, a rejected token and a successful post look
      # identical, which is how every run so far reported nothing at all
      # without anybody noticing.
      #
      # The two CF-Access headers are sent only when both are set.
      # heartbeat.bbanetwork.org sits behind Cloudflare Access at *Worker*
      # scope, which protects /api/agent-runs along with the dashboard itself,
      # so an unauthenticated POST from a runner gets the login redirect rather
      # than the API. An Access service token is how a machine gets through.
      # See docs/AGENTS.md.
      - name: Report the run
        if: always()
        run: |
          STATUS="ok"
          SUMMARY="Legacy customer paths all redirect correctly."
          # No `skipped` outcome any more — see the note on the identity check
          # above. The apex is attached, so a stranger answering on it is the
          # emergency this agent exists for, not a reason to stand down.
          if [ "${{ steps.probe.outputs.failed }}" = "true" ]; then
            STATUS="failed"
            SUMMARY="Legacy redirect check FAILED — customer download links may be broken."
          fi

          if [ -z "$DASHBOARD_URL" ]; then
            echo "::warning title=Dashboard reporting is off::DASHBOARD_URL is unset, so this run will not appear in Project 4's console."
            exit 0
          fi

          ARGS=(-H "Authorization: Bearer $DASHBOARD_TOKEN" -H 'Content-Type: application/json')
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            ARGS+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi

          PAYLOAD=$(printf '{"agent":"%s","project_slug":"project-6","trigger":"cron","status":"%s","summary":"%s","artifact_url":"%s"}' \
            "redirect-guard" "$STATUS" "$SUMMARY" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")

          # Status code, not curl's exit code. `curl -sf` treats a 3xx as
          # success — `-f` only fails on 4xx and 5xx — so a redirect to the
          # Cloudflare Access login page came back as exit 0 and this step
          # printed "Reported to" over a run that was never recorded. That is
          # the exact failure the step was rewritten to prevent, so it now
          # reads the code and insists on a 2xx.
          CODE=$(curl -s -o /tmp/report-body -w '%{http_code}' \
                   -X POST "$DASHBOARD_URL/api/agent-runs" "${ARGS[@]}" -d "$PAYLOAD")

          case "$CODE" in
            2*)
              echo "Reported to $DASHBOARD_URL ($CODE)"
              ;;
            3*)
              echo "::warning title=Dashboard redirected the run::POST to $DASHBOARD_URL/api/agent-runs answered $CODE instead of recording anything — a redirect to a login page, which means Cloudflare Access is in front of it and this runner has no service token. See docs/AGENTS.md."
              ;;
            000)
              echo "::warning title=Dashboard did not answer::POST to $DASHBOARD_URL/api/agent-runs did not connect at all. Check the hostname resolves."
              ;;
            *)
              echo "::warning title=Dashboard refused the run::POST to $DASHBOARD_URL/api/agent-runs answered $CODE. A 401 means DASHBOARD_TOKEN does not match the value set on the Worker."
              head -c 200 /tmp/report-body || true
              ;;
          esac
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
