name: Agent · Redirect guard

# The legacy apex paths that carry paying customers to their downloads.
#
# This ran as a GitHub Action until 2026-08-24, moved to a Cloudflare Cron
# Trigger on bba-network-hub, and has come back. The move was reasonable and
# the result was not: the check probes https://bbanetwork.org nine times, and
# from inside the Worker that serves that hostname Cloudflare answers 522 to
# every one. It reported `failed` every single day, and no run in this
# repository reported anything at all until 2026-08-26, so nobody saw.
#
# Proved rather than assumed, on 2026-08-26: a GitHub runner got 200 from the
# apex one second before the Worker's own probes got 522.
#
# The rule that falls out of it, and the reason link-warden did not move back:
#
#   A check whose subject is this repo's own hostnames cannot run inside the
#   Worker that serves them.
#
# 07:40 UTC — 03:40 ET — the same time it has always run. Cron is UTC because
# GitHub Actions accepts nothing else; the reading in Eastern is here so nobody
# has to subtract.

on:
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch:

concurrency:
  group: agent-redirect-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `issues: write` is what lets a failure reach a person. See the last two
    # steps: everything else this workflow does is written somewhere a human
    # has to decide to go and look.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # tsx rather than a build step: the point is to run src/checks.ts itself,
      # unchanged and unbundled. A verification path that runs different code
      # from the thing it verifies proves nothing about the thing it verifies.
      #
      # The script reports its own run through src/report.ts — the same module
      # the Worker uses — so there is no second implementation of reporting
      # here either. It exits 1 when the check fails, after reporting.
      - name: Probe the apex and every business host from outside them
        id: guard
        run: |
          set -o pipefail
          npx --yes tsx@4 scripts/redirect-guard.ts 2>&1 | tee /tmp/guard.log
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # The script reports whether it passes or fails, so the only run that
      # goes unreported is one where the script itself died — a bad import, a
      # missing dependency, a runner that fell over. That is exactly the case
      # where the console would otherwise show this agent quietly going silent,
      # which is the failure this repository spent 2026-08-26 removing.
      #
      # It fires only when nothing in the log says reporting was attempted, so
      # a normal failing check is never reported twice.
      - name: Say so if the script died before it could report
        if: always()
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          CID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CSEC: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if grep -q 'redirect-guard: \(not \)\?reported' /tmp/guard.log 2>/dev/null; then
            echo "The script reported its own run. Nothing to do here."
            exit 0
          fi

          if [ -z "$DASHBOARD_URL" ]; then
            echo "::warning title=Nothing reported::The check script did not get as far as reporting, and DASHBOARD_URL is not set here either, so this run was recorded nowhere. The console will show redirect-guard going silent."
            exit 0
          fi

          echo "::warning title=Script died before reporting::Posting a failed run so the console does not show this agent going quiet."
          CODE=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 20 \
            -X POST "${DASHBOARD_URL%/}/api/agent-runs" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $DASHBOARD_TOKEN" \
            -H "CF-Access-Client-Id: $CID" \
            -H "CF-Access-Client-Secret: $CSEC" \
            --data "{\"agent\":\"redirect-guard\",\"project_slug\":\"project-6\",\"trigger\":\"cron\",\"status\":\"failed\",\"summary\":\"The check did not run: scripts/redirect-guard.ts failed before it could report. Nothing is known about the apex paths this run.\",\"artifact_url\":\"$RUN_URL\"}")
          echo "POST /api/agent-runs -> $CODE"
          head -c 300 /tmp/out
          exit 0

      # ─────────────────────────────────────────────────────────────────────
      # Telling a human.
      #
      # Everything above this line records the run. Project 4's console is
      # private and behind Cloudflare Access; a red workflow run is visible to
      # whoever opens the Actions tab. Both are places somebody has to decide
      # to go and look, and neither of them is being *told*.
      #
      # That gap was named plainly on 2026-09-03: a business could go down,
      # this check could catch it within the hour, and the owner would still
      # hear about it from a customer. GitHub emails the owner of a repository
      # when an issue is opened on it, and that is the one channel already
      # wired to a phone without adding a service, a key or a monthly bill.
      #
      # One issue, updated — not one per run. A check that files a fresh
      # ticket every morning gets muted inside a week, and a muted alarm is
      # worse than no alarm, because it is still believed in.
      #
      # The body is built with `echo` into a file rather than a heredoc: a
      # heredoc's terminator has to sit at column zero, which inside an
      # indented YAML block means it never terminates, and every line of the
      # message would arrive with ten spaces of indent that turn the whole
      # thing into a markdown code block.
      - name: Say so, to a person, if something is unreachable
        if: always() && steps.guard.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The verdict lines the two checks print. If the script died before
          # printing either there is no diagnosis to pass on — say that,
          # rather than sending an empty alarm: "something is wrong and I
          # cannot tell you what" is itself the thing to act on.
          PROBLEMS=$(grep -E '^(redirect-guard|link-warden): FAILED' /tmp/guard.log 2>/dev/null \
            | sed -E 's/^[a-z-]+: FAILED[^a-zA-Z]*/- /' || true)
          [ -n "$PROBLEMS" ] || PROBLEMS="- The check did not finish, so nothing is known about the addresses this run. That is not the same as everything being fine."

          # What each address actually served. This is the half that would
          # have caught audit.bbanetwork.org answering 200 with the hub's own
          # homepage for five days in August.
          SERVED=$(grep -E '^  [a-z-]+ \([a-z0-9.-]+\) ' /tmp/guard.log 2>/dev/null || true)
          [ -n "$SERVED" ] || SERVED="  (the check did not get far enough to read any pages)"

          {
            echo "The daily check on the BBA Network addresses found something wrong."
            echo
            echo "**What is wrong**"
            echo
            echo "$PROBLEMS"
            echo
            echo "**What each address served just now**"
            echo
            echo '```'
            echo "$SERVED"
            echo '```'
            echo
            echo "If one of these is down, a customer who goes there sees a dead page rather than a"
            echo "business — and if it is a shop, a shop with the lights off and the sign still saying open."
            echo
            echo "Checked from outside the network, so this is about the address itself,"
            echo "not about the machine doing the checking."
            echo
            echo "[The full run]($RUN_URL)"
            echo
            echo "---"
            echo
            echo "This closes itself the next time the check passes. While it is open, it is still broken."
          } > /tmp/issue-body.md

          # Idempotent. A missing label must never be the reason an outage
          # goes unreported.
          gh label create network-down --color B60205 \
            --description "An address on the network is not answering" 2>/dev/null || true

          EXISTING=$(gh issue list --repo "$REPO" --label network-down --state open \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING is already open for this. Adding today's findings to it."
            gh issue comment "$EXISTING" --repo "$REPO" --body-file /tmp/issue-body.md
          else
            gh issue create --repo "$REPO" --label network-down \
              --title "A BBA Network address is not answering" --body-file /tmp/issue-body.md
          fi

      # The other half, and the half that decides whether the first one is
      # believed. An alarm nobody ever switches off stops being an alarm.
      - name: Close the alarm once everything answers again
        if: always() && steps.guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for N in $(gh issue list --repo "$REPO" --label network-down --state open \
            --json number --jq '.[].number'); do
            echo "Closing #$N — everything answered this run."
            gh issue close "$N" --repo "$REPO" --reason completed \
              --comment "Everything is answering again as of this run. Nothing to do. [The run]($RUN_URL)"
          done
