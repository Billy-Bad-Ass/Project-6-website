name: Deploy

# The hub is the apex. A broken deploy here does not just break a marketing
# page — it breaks the redirects that carry paying customers to their
# downloads. So the tests are a gate, not a parallel job.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Gate on the test suite
        run: npm run check

      # Wrangler's own message for a missing token is accurate but buried in a
      # collapsed log group, and it says nothing about WHERE to put the token
      # for this repository. A deploy that cannot possibly succeed should say
      # so in one line, at the top, before it burns a minute finding out.
      - name: Check the deploy has what it needs
        run: |
          MISSING=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"

          if [ -n "$MISSING" ]; then
            echo "::error title=Deploy secrets are not set::Missing:$MISSING — add them under Settings → Secrets and variables → Actions → New repository secret. The API token needs the 'Edit Cloudflare Workers' template; the account id is on any domain's overview page in the Cloudflare dashboard. Nothing is wrong with the code: this run cannot authenticate."
            exit 1
          fi

          # Not fatal. The dashboard is Project 4's, it may legitimately not be
          # wired up yet, and every reporting step already ends in `|| true`.
          if [ -z "$DASHBOARD_URL" ] || [ -z "$DASHBOARD_TOKEN" ]; then
            echo "::warning title=Dashboard reporting is off::DASHBOARD_URL or DASHBOARD_TOKEN is unset, so this deploy will not appear in Project 4's console. The deploy itself is unaffected."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Prove the thing that just deployed actually answers, rather than
      # trusting a green deploy step.
      #
      # This tests the apex, because the apex is now this Worker. It used to
      # test the workers.dev hostname instead, and had to: the custom domain
      # was still attached to Project 2's store, so /api/health returned the
      # store's payload and /api/download returned the store's 403 for a bogus
      # token — failing a deploy that had entirely succeeded.
      #
      # Testing the customer-facing host is the stricter check and the one
      # worth having: a Worker that deployed perfectly but is no longer
      # attached to bbanetwork.org is an outage, and this step should say so.
      # The identity check below is what tells those two failures apart.
      - name: Smoke-test the deployment
        run: |
          BASE="${SITE_URL:-$FALLBACK_URL}"
          echo "Testing $BASE"

          echo "→ $BASE/api/health"
          if ! BODY=$(curl -sf --max-time 20 "$BASE/api/health"); then
            echo "::error::$BASE/api/health did not answer. The Worker deployed; the host is not serving it. Check the custom domain is still attached to bba-network-hub — see docs/DOMAINS.md."
            exit 1
          fi
          echo "  $BODY"

          # Identity check. Without it this step happily passes against whatever
          # else happens to be answering on that hostname.
          #
          # Matched with grep and an explicit whitespace class, not a glob: the
          # hub pretty-prints its JSON, so the body reads `"service": "..."`
          # with a space after the colon. A glob written without one matches
          # nothing, which is exactly how this failed the first time — against
          # a Worker that was up and answering correctly.
          if ! echo "$BODY" | grep -q '"service"[[:space:]]*:[[:space:]]*"bba-network-hub"'; then
            echo "::error title=That host is not this hub::$BASE answered, but with something else — the hostname is attached to a different Worker. See docs/DOMAINS.md, 'Attaching a domain to a Worker'. The deploy itself succeeded."
            exit 1
          fi

          # The rule that pays the rent: this is the exact URL shape sitting in
          # already-sent receipts.
          echo "→ $BASE/api/download (must redirect to the store, method-preserving)"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/api/download?token=smoke")
          LOC=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 "$BASE/api/download?token=smoke")
          echo "  $CODE → $LOC"
          [ "$CODE" = "308" ] || { echo "::error::Expected 308, got $CODE. Customer download links are at risk."; exit 1; }
          case "$LOC" in
            https://guides.bbanetwork.org/api/download*) ;;
            *) echo "::error::Redirect target is wrong: $LOC"; exit 1 ;;
          esac

          echo "→ $BASE/products/espresso-dial-in-card (301 to the store)"
          PCODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/products/espresso-dial-in-card")
          [ "$PCODE" = "301" ] || { echo "::error::Expected 301 for an indexed product page, got $PCODE."; exit 1; }

          # /licence is a hub page that used to be a 301 to the store. If a
          # redirect rule ever reclaims it, the terms a customer agreed to at
          # checkout stop resolving — so it is checked, not assumed.
          echo "→ $BASE/licence (must be served here, not redirected)"
          LCODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/licence")
          [ "$LCODE" = "200" ] || { echo "::error::Expected 200 for /licence, got $LCODE. The licence and refund terms are not resolving."; exit 1; }

          echo "→ $BASE/brand/v1.css (the subdomains link this)"
          curl -sf --max-time 20 -o /dev/null "$BASE/brand/v1.css" \
            || { echo "::error::/brand/v1.css did not serve. guides. and audit. would lose their styling."; exit 1; }
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FALLBACK_URL: https://bbanetwork.org

      # The apex is attached; www is the half that is easy to forget.
      #
      # Reported and never enforced. A missing www costs the visitors who type
      # it and nobody else, so it is not worth failing a good deploy over —
      # but it is worth saying out loud every time, because the only way it
      # gets noticed otherwise is a customer telling you.
      - name: Does www serve the hub too?
        if: always()
        run: |
          BODY=$(curl -sfL --max-time 20 https://www.bbanetwork.org/api/health || echo '')
          if [ -z "$BODY" ]; then
            echo "::warning title=www did not answer::www.bbanetwork.org/api/health returned nothing. Attach www.bbanetwork.org to bba-network-hub in the Cloudflare dashboard — docs/DOMAINS.md has the steps."
          elif echo "$BODY" | grep -q '"service"[[:space:]]*:[[:space:]]*"bba-network-hub"'; then
            echo "::notice title=www is live on the hub::www.bbanetwork.org is serving bba-network-hub."
          else
            echo "::warning title=www points elsewhere::www.bbanetwork.org answered with something other than this hub — it is attached to a different Worker."
          fi

      # Report into Project 4's console. `|| true` because losing a log entry
      # must never fail a deploy that already succeeded.
      - name: Report the run
        if: always()
        run: |
          curl -sf -X POST "$DASHBOARD_URL/api/agent-runs" \
            -H "Authorization: Bearer $DASHBOARD_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"agent\":\"deploy\",\"project_slug\":\"project-6\",\"trigger\":\"github\",
                 \"status\":\"${{ job.status == 'success' && 'ok' || 'failed' }}\",
                 \"summary\":\"Apex hub deploy from ${GITHUB_SHA:0:7}.\",
                 \"artifact_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            || true
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
