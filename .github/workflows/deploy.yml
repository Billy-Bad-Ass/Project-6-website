name: Deploy

# The hub is the apex. A broken deploy here does not just break a marketing
# page — it breaks the redirects that carry paying customers to their
# downloads. So the tests are a gate, not a parallel job.
#
# MANUAL ONLY, deliberately, and temporarily. Cloudflare Workers Builds now
# deploys on push to `main`; leaving this workflow on the same trigger would
# mean two systems racing to deploy the same commit and no way to tell which
# one succeeded. Keeping it dispatchable is the safety net — if Workers Builds
# turns out not to work, this still ships a fix without any repo change.
#
# Delete this file once Workers Builds has deployed successfully.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Gate on the test suite
        run: npm run check

      # Wrangler's own message for a missing token is accurate but buried in a
      # collapsed log group, and it says nothing about WHERE to put the token
      # for this repository. A deploy that cannot possibly succeed should say
      # so in one line, at the top, before it burns a minute finding out.
      - name: Check the deploy has what it needs
        run: |
          MISSING=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"

          if [ -n "$MISSING" ]; then
            echo "::error title=Deploy secrets are not set::Missing:$MISSING — add them under Settings → Secrets and variables → Actions → New repository secret. The API token needs the 'Edit Cloudflare Workers' template; the account id is on any domain's overview page in the Cloudflare dashboard. Nothing is wrong with the code: this run cannot authenticate."
            exit 1
          fi

          # Not fatal. The dashboard is Project 4's, it may legitimately not be
          # wired up yet, and every reporting step already ends in `|| true`.
          if [ -z "$DASHBOARD_URL" ] || [ -z "$DASHBOARD_TOKEN" ]; then
            echo "::warning title=Dashboard reporting is off::DASHBOARD_URL or DASHBOARD_TOKEN is unset, so this deploy will not appear in Project 4's console. The deploy itself is unaffected."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Prove the thing that just deployed actually answers, rather than
      # trusting a green deploy step.
      #
      # This tests the apex, because the apex is now this Worker. It used to
      # test the workers.dev hostname instead, and had to: the custom domain
      # was still attached to Project 2's store, so /api/health returned the
      # store's payload and /api/download returned the store's 403 for a bogus
      # token — failing a deploy that had entirely succeeded.
      #
      # Testing the customer-facing host is the stricter check and the one
      # worth having: a Worker that deployed perfectly but is no longer
      # attached to bbanetwork.org is an outage, and this step should say so.
      # The identity check below is what tells those two failures apart.
      - name: Smoke-test the deployment
        run: |
          BASE="${SITE_URL:-$FALLBACK_URL}"
          echo "Testing $BASE"

          echo "→ $BASE/api/health"
          if ! BODY=$(curl -sf --max-time 20 "$BASE/api/health"); then
            echo "::error::$BASE/api/health did not answer. The Worker deployed; the host is not serving it. Check the custom domain is still attached to bba-network-hub — see docs/DOMAINS.md."
            exit 1
          fi
          echo "  $BODY"

          # Identity check. Without it this step happily passes against whatever
          # else happens to be answering on that hostname.
          #
          # Matched with grep and an explicit whitespace class, not a glob: the
          # hub pretty-prints its JSON, so the body reads `"service": "..."`
          # with a space after the colon. A glob written without one matches
          # nothing, which is exactly how this failed the first time — against
          # a Worker that was up and answering correctly.
          if ! echo "$BODY" | grep -q '"service"[[:space:]]*:[[:space:]]*"bba-network-hub"'; then
            echo "::error title=That host is not this hub::$BASE answered, but with something else — the hostname is attached to a different Worker. See docs/DOMAINS.md, 'Attaching a domain to a Worker'. The deploy itself succeeded."
            exit 1
          fi

          # The rule that pays the rent: this is the exact URL shape sitting in
          # already-sent receipts.
          echo "→ $BASE/api/download (must redirect to the store, method-preserving)"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/api/download?token=smoke")
          LOC=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 "$BASE/api/download?token=smoke")
          echo "  $CODE → $LOC"
          [ "$CODE" = "308" ] || { echo "::error::Expected 308, got $CODE. Customer download links are at risk."; exit 1; }
          case "$LOC" in
            https://guides.bbanetwork.org/api/download*) ;;
            *) echo "::error::Redirect target is wrong: $LOC"; exit 1 ;;
          esac

          echo "→ $BASE/products/espresso-dial-in-card (301 to the store)"
          PCODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/products/espresso-dial-in-card")
          [ "$PCODE" = "301" ] || { echo "::error::Expected 301 for an indexed product page, got $PCODE."; exit 1; }

          # /licence is a hub page that used to be a 301 to the store. If a
          # redirect rule ever reclaims it, the terms a customer agreed to at
          # checkout stop resolving — so it is checked, not assumed.
          echo "→ $BASE/licence (must be served here, not redirected)"
          LCODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/licence")
          [ "$LCODE" = "200" ] || { echo "::error::Expected 200 for /licence, got $LCODE. The licence and refund terms are not resolving."; exit 1; }

          echo "→ $BASE/brand/v1.css (the subdomains link this)"
          curl -sf --max-time 20 -o /dev/null "$BASE/brand/v1.css" \
            || { echo "::error::/brand/v1.css did not serve. guides. and audit. would lose their styling."; exit 1; }
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FALLBACK_URL: https://bbanetwork.org

      # The apex is attached; www is the half that is easy to forget.
      #
      # Reported and never enforced. A missing www costs the visitors who type
      # it and nobody else, so it is not worth failing a good deploy over.
      #
      # It does have to say WHY, though. The first version of this step ran
      # `curl -sfL` and reported "returned nothing", which is true of a
      # hostname that does not resolve, one whose certificate is not issued
      # yet, and one that resolves fine and answers 522 — three faults with
      # three different fixes. `-f` turns an HTTP error into an empty string
      # and `-s` hides the reason, so the check could not tell them apart, and
      # someone who had correctly attached the domain was told to attach it
      # again. Separate the three: connection failures come back as a non-zero
      # curl exit with a message, HTTP errors come back as a status code.
      - name: Does www serve the hub too?
        if: always()
        run: |
          # Not `-f`: an HTTP error status is a different diagnosis from a
          # failed connection, and this step exists to tell them apart.
          set +e
          CODE=$(curl -sS -L --max-time 20 \
                   -o /tmp/www-body -w '%{http_code}' \
                   https://www.bbanetwork.org/api/health 2>/tmp/www-error)
          RC=$?
          set -e

          # Resolution, reported whatever happens. "No addresses" here means
          # the DNS record was never created, which is a different problem
          # from a record that exists and points at the wrong place.
          ADDR=$(getent ahostsv4 www.bbanetwork.org 2>/dev/null | awk '{print $1}' | sort -u | paste -sd' ' -)
          echo "www.bbanetwork.org resolves to: ${ADDR:-<no addresses>}"

          if [ "$RC" -ne 0 ]; then
            REASON=$(tr -d '\r' < /tmp/www-error | tail -1)
            echo "::warning title=www did not connect::curl exit $RC — ${REASON:-no detail}. DNS: ${ADDR:-none}. A name that does not resolve means no record was created; a TLS error usually means the certificate is still being issued, which resolves itself within minutes."
            exit 0
          fi

          if [ "$CODE" != "200" ]; then
            echo "::warning title=www answered HTTP $CODE::www.bbanetwork.org connected and returned $CODE rather than 200. It resolves (${ADDR:-unknown}), so the DNS record exists — the hostname is reaching Cloudflare but not this Worker."
            head -c 300 /tmp/www-body || true
            exit 0
          fi

          if grep -q '"service"[[:space:]]*:[[:space:]]*"bba-network-hub"' /tmp/www-body; then
            echo "::notice title=www is live on the hub::www.bbanetwork.org is serving bba-network-hub."
          else
            echo "::warning title=www points elsewhere::www.bbanetwork.org answered 200 with something other than this hub — it is attached to a different Worker."
            head -c 300 /tmp/www-body || true
          fi

      # Report into Project 4's console.
      #
      # This never fails the job — losing a log entry must not fail work that
      # already succeeded. But it no longer fails *silently*. A bare `|| true`
      # made an unset URL, a rejected token and a successful post look
      # identical, which is how every run so far reported nothing at all
      # without anybody noticing.
      #
      # The two CF-Access headers are sent only when both are set.
      # heartbeat.bbanetwork.org sits behind Cloudflare Access at *Worker*
      # scope, which protects /api/agent-runs along with the dashboard itself,
      # so an unauthenticated POST from a runner gets the login redirect rather
      # than the API. An Access service token is how a machine gets through.
      # See docs/AGENTS.md.
      - name: Report the run
        if: always()
        run: |
          if [ -z "$DASHBOARD_URL" ]; then
            echo "::warning title=Dashboard reporting is off::DASHBOARD_URL is unset, so this run will not appear in Project 4's console."
            exit 0
          fi

          ARGS=(-H "Authorization: Bearer $DASHBOARD_TOKEN" -H 'Content-Type: application/json')
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            ARGS+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi

          PAYLOAD=$(printf '{"agent":"deploy","project_slug":"project-6","trigger":"github","status":"%s","summary":"Apex hub deploy from %s.","artifact_url":"%s"}' \
            "${{ job.status == 'success' && 'ok' || 'failed' }}" \
            "${GITHUB_SHA:0:7}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")

          # Status code, not curl's exit code. `curl -sf` treats a 3xx as
          # success — `-f` only fails on 4xx and 5xx — so a redirect to the
          # Cloudflare Access login page came back as exit 0 and this step
          # printed "Reported to" over a run that was never recorded. That is
          # the exact failure the step was rewritten to prevent, so it now
          # reads the code and insists on a 2xx.
          CODE=$(curl -s -o /tmp/report-body -w '%{http_code}' \
                   -X POST "$DASHBOARD_URL/api/agent-runs" "${ARGS[@]}" -d "$PAYLOAD")

          case "$CODE" in
            2*)
              echo "Reported to $DASHBOARD_URL ($CODE)"
              ;;
            3*)
              echo "::warning title=Dashboard redirected the run::POST to $DASHBOARD_URL/api/agent-runs answered $CODE instead of recording anything — a redirect to a login page, which means Cloudflare Access is in front of it and this runner has no service token. See docs/AGENTS.md."
              ;;
            000)
              echo "::warning title=Dashboard did not answer::POST to $DASHBOARD_URL/api/agent-runs did not connect at all. Check the hostname resolves."
              ;;
            *)
              echo "::warning title=Dashboard refused the run::POST to $DASHBOARD_URL/api/agent-runs answered $CODE. A 401 means DASHBOARD_TOKEN does not match the value set on the Worker."
              head -c 200 /tmp/report-body || true
              ;;
          esac
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
